name: tests-fast

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  fast-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run fast pytest (exclude integration/slow)
        run: uv run python -m pytest tests/ -q -m "not integration and not slow"
